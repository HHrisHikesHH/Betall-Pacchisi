<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" width="1600" height="260" role="img" aria-labelledby="t d">
<title id="t">One night, repeated</title>
<desc id="d">Four steps in a loop: the king takes the corpse from its tree, carries it on his shoulder, listens to its tale, and meets the question that closes it, after which the corpse returns to the tree and the journey begins again.</desc>
